name: Close referenced issues

# GitHubがIssueを自動クローズするのはデフォルトブランチへマージされたときだけである。
# Epic用の統合ブランチへマージされたsub PRについては、本文の `Refs #<番号>` 等を読んで
# このワークフローがクローズする。詳細は AGENTS.md §3.2.1 を参照。

on:
  pull_request_target:
    types:
      - closed

permissions:
  issues: write

jobs:
  close:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # PR本文はユーザ入力なので、シェルへ展開せず環境変数のまま扱う。
          numbers="$(
            printf '%s' "${PR_BODY}" \
              | grep -oiE '(refs|close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
              | grep -oE '[0-9]+' \
              | sort -u -n \
              || true
          )"

          if [ -z "${numbers}" ]; then
            echo "No issue references found in the pull request body."
            exit 0
          fi

          for n in ${numbers}; do
            if [ "${n}" = "${PR_NUMBER}" ]; then
              continue
            fi

            state="$(gh issue view "${n}" --repo "${REPO}" --json state --jq .state 2>/dev/null || echo 'UNAVAILABLE')"
            if [ "${state}" != "OPEN" ]; then
              echo "Skipping #${n} (state: ${state})."
              continue
            fi

            echo "Closing #${n}."
            gh issue close "${n}" --repo "${REPO}" \
              --comment "Closed by #${PR_NUMBER}, merged into \`${BASE_REF}\`."
          done
